upstream binovet_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name binovet.com www.binovet.com;

    # Redirect HTTP -> HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name binovet.com www.binovet.com;

    # SSL Configuration
    ssl_certificate     /etc/letsencrypt/live/binovet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/binovet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/binovet-access.log;
    error_log  /var/log/nginx/binovet-error.log;

    # Client Upload
    client_max_body_size 100M;

    location / {
        proxy_pass http://binovet_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_connect_timeout 30s;
    }

    # Static assets
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        proxy_pass http://binovet_app;
    }

    # upload (public/uploads)
    location /uploads/ {
        alias /var/www/binovet/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
